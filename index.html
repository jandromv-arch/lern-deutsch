<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lern Deutsch" />
    <meta name="description" content="Apprends le vocabulaire allemand — pour francophones." />
    <title>Lern Deutsch</title>
    <script>
      // Apply theme before paint to avoid a light flash on dark cold-load.
      try {
        var raw = localStorage.getItem('lern-deutsch-v1');
        var pref = raw ? (JSON.parse(raw).state || {}).themePref : 'system';
        var dark = pref === 'dark' ||
          ((!pref || pref === 'system') &&
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
